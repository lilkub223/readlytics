services:
  - type: web
    name: readlytics-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USER_SERVICE_URL
        fromService:
          type: web
          name: readlytics-user-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_READING_SERVICE_URL
        fromService:
          type: web
          name: readlytics-reading-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_ANALYTICS_SERVICE_URL
        fromService:
          type: web
          name: readlytics-analytics-service
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: readlytics-user-service
    runtime: node
    plan: free
    rootDir: .
    buildFilter:
      paths:
        - services/user-service/**
        - infra/docker/init.sql
        - render.yaml
    buildCommand: npm ci --prefix services/user-service --omit=dev --no-audit --no-fund
    startCommand: npm --prefix services/user-service start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: readlytics-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "https://readlytics-web.onrender.com"
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: readlytics-reading-service
    runtime: python
    plan: free
    rootDir: .
    buildFilter:
      paths:
        - services/reading-service/**
        - infra/docker/init.sql
        - render.yaml
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: readlytics-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "https://readlytics-web.onrender.com"
      - key: JWT_SECRET
        fromService:
          type: web
          name: readlytics-user-service
          envVarKey: JWT_SECRET

  - type: web
    name: readlytics-analytics-service
    runtime: python
    plan: free
    rootDir: .
    buildFilter:
      paths:
        - services/analytics-service/**
        - infra/docker/init.sql
        - render.yaml
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: readlytics-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "https://readlytics-web.onrender.com"
      - key: JWT_SECRET
        fromService:
          type: web
          name: readlytics-user-service
          envVarKey: JWT_SECRET

databases:
  - name: readlytics-db
    plan: free
    databaseName: book_platform
    user: readlytics
